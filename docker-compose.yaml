services:
  postgres:
    image: postgres:16
    container_name: second-brain-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: secondbrain
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:alpine
    container_name: second-brain-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant
    container_name: second-brain-qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':< /dev/tcp/127.0.0.1/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    container_name: second-brain-migrate
    env_file: .env
    command: ["pnpm", "--dir", "apps/api", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    container_name: second-brain-api
    restart: always
    env_file: .env
    ports:
      - "${API_PORT:-3000}:3000"
    command: ["pnpm", "--dir", "apps/api", "exec", "tsx", "src/index.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  bot:
    build: .
    container_name: second-brain-bot
    restart: always
    env_file: .env
    command: ["pnpm", "--dir", "apps/platform", "exec", "tsx", "src/index.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  worker:
    build: .
    container_name: second-brain-worker
    restart: always
    env_file: .env
    command: ["pnpm", "--dir", "apps/api", "exec", "tsx", "src/worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  reminder:
    build: .
    container_name: second-brain-reminder
    restart: always
    env_file: .env
    command: ["pnpm", "--dir", "apps/platform", "exec", "tsx", "src/reminder-worker.ts"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  qdrantdata:
